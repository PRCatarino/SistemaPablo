# Uso na VPS: ajuste senhas e AUTH_SECRET. Coloque TLS no reverse proxy (Caddy/Nginx).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trelloroupa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
      POSTGRES_DB: trelloroupa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trelloroupa -d trelloroupa"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://trelloroupa:${POSTGRES_PASSWORD:-troque_esta_senha}@db:5432/trelloroupa
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # Primeira vez: docker compose run --rm web npm run db:seed
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  pgdata:
  uploads:
