<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ArtFlow - Industrial Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#f2bc82",
                      "surface-container-lowest": "#ffffff",
                      "surface-variant": "#e0e3e5",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#ffddba",
                      "surface-tint": "#455f88",
                      "primary-fixed-dim": "#adc7f7",
                      "on-tertiary-fixed-variant": "#633f0f",
                      "surface-container-high": "#e6e8ea",
                      "tertiary": "#321b00",
                      "surface-container-highest": "#e0e3e5",
                      "secondary": "#006a6a",
                      "surface-bright": "#f7f9fb",
                      "on-tertiary-fixed": "#2b1700",
                      "secondary-fixed-dim": "#6fd7d6",
                      "inverse-primary": "#adc7f7",
                      "on-tertiary-container": "#c6955e",
                      "on-tertiary": "#ffffff",
                      "primary-fixed": "#d6e3ff",
                      "error": "#ba1a1a",
                      "primary": "#002045",
                      "on-primary-fixed-variant": "#2d476f",
                      "on-background": "#191c1e",
                      "tertiary-container": "#4f2e00",
                      "surface-container": "#eceef0",
                      "on-secondary-fixed": "#002020",
                      "primary-container": "#1a365d",
                      "error-container": "#ffdad6",
                      "surface": "#f7f9fb",
                      "inverse-surface": "#2d3133",
                      "secondary-container": "#8cf3f3",
                      "on-surface-variant": "#43474e",
                      "surface-dim": "#d8dadc",
                      "on-surface": "#191c1e",
                      "on-primary-fixed": "#001b3c",
                      "secondary-fixed": "#8cf3f3",
                      "outline-variant": "#c4c6cf",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#eff1f3",
                      "on-secondary-fixed-variant": "#004f4f",
                      "on-secondary-container": "#007070",
                      "on-primary-container": "#86a0cd",
                      "surface-container-low": "#f2f4f6",
                      "on-secondary": "#ffffff",
                      "background": "#f7f9fb",
                      "outline": "#74777f",
                      "on-error-container": "#93000a"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "fontFamily": {
                      "headline": ["Manrope"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .industrial-bg {
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 106, 106, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 32, 69, 0.05) 0px, transparent 50%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-6 industrial-bg overflow-hidden">
<!-- Abstract Industrial Background Elements -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-primary/5 blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-secondary/5 blur-3xl"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-md z-10">
<!-- Logo & Branding -->
<div class="text-center mb-8">
<h1 class="font-headline text-3xl font-extrabold text-primary tracking-widest uppercase mb-2">
                ArtFlow
            </h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide font-medium">
                SISTEMA DE GESTÃO DE ARTES PARA CONFECÇÃO
            </p>
</div>
<!-- Login Card -->
<section class="glass-panel rounded-xl shadow-lg p-10 relative overflow-hidden">
<!-- Tonal Progress Thread (Decorative) -->
<div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-secondary-fixed-dim to-secondary"></div>
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-1">
<label class="block font-label text-[0.6875rem] uppercase font-semibold tracking-wider text-on-surface-variant ml-1">
                        Username
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-high border-none rounded-lg text-on-surface focus:ring-0 focus:border-b-2 focus:border-secondary transition-all duration-200 placeholder:text-outline/50 font-body text-sm" placeholder="Digite seu usuário" type="text"/>
</div>
</div>
<!-- Role Selector -->
<div class="space-y-1">
<label class="block font-label text-[0.6875rem] uppercase font-semibold tracking-wider text-on-surface-variant ml-1">
                        Cargo / Função
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">badge</span>
<select class="w-full pl-10 pr-10 py-3 bg-surface-container-high border-none rounded-lg text-on-surface appearance-none focus:ring-0 focus:border-b-2 focus:border-secondary transition-all duration-200 font-body text-sm">
<option disabled="" selected="" value="">Selecione seu cargo</option>
<option>Administrador</option>
<option>Atendente</option>
<option>Designer</option>
<option>Finalizador</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Error State Example -->
<div class="flex items-center gap-2 px-3 py-2 bg-error-container/30 rounded-lg border border-error/10">
<span class="material-symbols-outlined text-error text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body text-xs font-semibold text-on-error-container uppercase tracking-tight">
                        Credenciais inválidas
                    </p>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full py-4 rounded-lg bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-sm uppercase tracking-widest shadow-md hover:shadow-xl hover:translate-y-[-1px] active:translate-y-[1px] transition-all duration-200 flex justify-center items-center gap-3" type="submit">
                        Entrar
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 flex justify-between items-center text-[0.6875rem] font-semibold text-outline tracking-wider uppercase">
<a class="hover:text-primary transition-colors" href="#">Esqueci minha senha</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="hover:text-primary transition-colors" href="#">Solicitar acesso</a>
</div>
</section>
<!-- Industrial Atelier Signature -->
<footer class="mt-8 text-center flex flex-col items-center gap-4">
<div class="flex gap-4">
<div class="flex items-center gap-1.5 opacity-40">
<span class="material-symbols-outlined text-sm">factory</span>
<span class="text-[0.6rem] font-bold tracking-[0.2em] uppercase">Facility V1.4</span>
</div>
<div class="flex items-center gap-1.5 opacity-40">
<span class="material-symbols-outlined text-sm">shield</span>
<span class="text-[0.6rem] font-bold tracking-[0.2em] uppercase">Secure Terminal</span>
</div>
</div>
<!-- Branding Image Background Subtlety -->
<div class="w-full h-px bg-gradient-to-r from-transparent via-outline-variant/30 to-transparent my-2"></div>
<div class="flex items-center justify-center gap-4 grayscale opacity-20">
<img alt="Industrial Context" class="h-6 object-contain" data-alt="abstract close up of industrial textile weaving machine with metallic threads and technical precision" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0ovVxrYrnBkVFFS_DK3h5J-Xj1m6u3NjQHXwaklWq1VoOJAhnOYf92E_KPVGjWFYtVAj84KO3zMXL27RgbI0I62H_a8eFBrwYN3a80qvesLhPW0wsHoiq-1q7wM4ZwuoLKwVN6G1lM80w4woR7ydJ0Zd1lMfwBrEOt6eXlnvhyEY_03QNU-SPetWi95kyaZ4IW4GpvnX_iyFXhHmG4y8vhx3t1QQaA0MC-pOoyY5aKB-lD1nnwi8H8uLOwWQ9-N0RITUFEBwRVU0R"/>
</div>
</footer>
</main>
<!-- Context Image Decoration (Side) -->
<div class="fixed right-10 bottom-10 hidden lg:block opacity-50 max-w-[200px]">
<div class="flex flex-col gap-2">
<div class="h-1 w-20 bg-secondary"></div>
<p class="font-headline text-on-surface-variant text-xs font-bold leading-tight uppercase tracking-tighter">
                Precisão no design,<br/>Agilidade na produção.
            </p>
</div>
</div>
</body></html>
