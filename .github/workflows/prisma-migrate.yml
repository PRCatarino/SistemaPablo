# Roda migrations no GitHub contra o Postgres configurado no secret DATABASE_URL.
# URI com senha URL-encoded; use host acessível a partir dos runners (ex.: IP público da VPS).
#
# Disparo: Actions → "Prisma migrate deploy" → Run workflow
name: Prisma migrate deploy

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
