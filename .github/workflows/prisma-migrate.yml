# Roda migrations no GitHub (rede costuma alcançar db.*.supabase.co:5432).
# Secret: DATABASE_URL = URI direta :5432 (senha URL-encoded), ou pooler se funcionar.
# Alternativa sem CLI: supabase/apply-migrations-once.sql no SQL Editor.
#
# Disparo: Actions → "Prisma migrate deploy" → Run workflow
name: Prisma migrate deploy

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
